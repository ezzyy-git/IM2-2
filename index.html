<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extinct Index</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- Mapbox CSS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
</head>

<body>

    <header>
        <h1>EXTINCT INDEX</h1>
        <nav>
            <input type="text" id="searchInput" class="hidden" placeholder="Search...">
            <button id="mapBtn">MAP</button>
            <button id="searchBtn">SEARCH</button>
            <button id="shuffleBtn">SHUFFLE</button>
            <button id="indexBtn">INDEX</button>
        </nav>
    </header>

    <main>
        <!-- Info panel (desktop: floating card / mobile: bottom sheet) -->
        <section id="infoPanel" class="hidden">
            <div class="info-fields">
                <div class="info-row">
                    <span class="info-label">Bio Name</span>
                    <span class="info-value" id="animalBioName">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Common Name</span>
                    <span class="info-value" id="animalCommon">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Location</span>
                    <span class="info-value" id="animalLocation">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Last recorded</span>
                    <span class="info-value" id="animalYear">—</span>
                </div>
            </div>
            <div class="info-image-wrap">
                <img id="animalImage" src="" alt="">
            </div>
        </section>

        <!-- MAP -->
        <section id="map"></section>

        <!-- Index list -->
        <section id="listSection" class="hidden">
            <!-- Mobile header inside list (replaces main header visually) -->
            <div class="list-header">
                <h2>EXTINCT INDEX</h2>
                <!-- Mobile nav row cloned for the list view -->
                <nav class="list-nav">
                    <button id="mapBtnList">MAP</button>
                    <button id="searchBtnList">SEARCH</button>
                    <button id="shuffleBtnList">SHUFFLE</button>
                    <button id="indexBtnList" class="active">INDEX</button>
                </nav>
            </div>
            <ul id="listContainer"></ul>
        </section>

        <!-- Shuffle / Loading overlay -->
        <div id="shuffleOverlay" class="hidden">
            <div class="shuffle-dots">
                <span class="dot dot-purple"></span>
                <span class="dot dot-lime"></span>
                <span class="dot dot-purple"></span>
            </div>
        </div>

    </main>

    <!-- JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="js/script.js"></script>

    <!-- Wire up the duplicated list-nav buttons on mobile -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const wire = (id, target) => {
          const el = document.getElementById(id);
          const orig = document.getElementById(target);
          if (el && orig) el.addEventListener('click', () => orig.click());
        };
        wire('mapBtnList',     'mapBtn');
        wire('searchBtnList',  'searchBtn');
        wire('shuffleBtnList', 'shuffleBtn');
        wire('indexBtnList',   'indexBtn');

        // Measure real header height and set CSS var for main height calc
        function setHeaderHeight() {
          const h = document.querySelector('header').offsetHeight;
          document.documentElement.style.setProperty('--mobile-header-h', h + 'px');
        }
        setHeaderHeight();
        window.addEventListener('resize', setHeaderHeight);
      });
    </script>
</body>

</html>
